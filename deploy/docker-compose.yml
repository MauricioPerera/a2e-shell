# a2e-shell — single-worker local/edge deployment with Traefik TLS termination.
#
# Usage:
#   export A2E_AUTH_TOKEN=$(openssl rand -hex 32)
#   docker compose up -d
#
# Production notes:
#   - Multi-worker isn't supported here (session state is local). For that, use
#     the Kubernetes manifest in deploy/kubernetes/.
#   - Sessions persist in a named volume; remove it to wipe all sessions.
#   - TLS certs are obtained from Let's Encrypt via Traefik's ACME.

services:
  a2e-shell:
    image: ghcr.io/mauricioperera/a2e-shell:latest
    restart: unless-stopped
    environment:
      A2E_PORT: "8080"
      A2E_SESSIONS_DIR: "/sessions"
      A2E_AUTH_TOKENS: "${A2E_AUTH_TOKEN:?A2E_AUTH_TOKEN is required}"
      A2E_MAX_REQUEST_BYTES: "1048576"
      A2E_RATE_LIMIT_PER_MINUTE: "120"
      A2E_RATE_LIMIT_CREATE_PER_MINUTE: "20"
      A2E_GRACE_PERIOD_MS: "25000"
      A2E_LOG_LEVEL: "info"
    volumes:
      - sessions:/sessions
    stop_grace_period: 30s
    healthcheck:
      test: ["CMD", "curl", "-fsS", "http://127.0.0.1:8080/healthz"]
      interval: 30s
      timeout: 3s
      retries: 3
      start_period: 5s
    labels:
      traefik.enable: "true"
      traefik.http.routers.a2e.rule: "Host(`${A2E_HOSTNAME:-a2e.localhost}`)"
      traefik.http.routers.a2e.entrypoints: "websecure"
      traefik.http.routers.a2e.tls.certresolver: "letsencrypt"
      traefik.http.services.a2e.loadbalancer.server.port: "8080"
      # Disable proxy buffering so SSE streaming works end-to-end.
      traefik.http.middlewares.a2e-sse.buffering.maxResponseBodyBytes: "0"
      traefik.http.routers.a2e.middlewares: "a2e-sse"

  traefik:
    image: traefik:v3.1
    restart: unless-stopped
    command:
      - "--providers.docker=true"
      - "--providers.docker.exposedbydefault=false"
      - "--entrypoints.web.address=:80"
      - "--entrypoints.web.http.redirections.entrypoint.to=websecure"
      - "--entrypoints.web.http.redirections.entrypoint.scheme=https"
      - "--entrypoints.websecure.address=:443"
      - "--certificatesresolvers.letsencrypt.acme.email=${ACME_EMAIL:?set ACME_EMAIL}"
      - "--certificatesresolvers.letsencrypt.acme.storage=/letsencrypt/acme.json"
      - "--certificatesresolvers.letsencrypt.acme.tlschallenge=true"
      - "--log.level=INFO"
      - "--accesslog=true"
    ports:
      - "80:80"
      - "443:443"
    volumes:
      - /var/run/docker.sock:/var/run/docker.sock:ro
      - letsencrypt:/letsencrypt

volumes:
  sessions:
  letsencrypt:
