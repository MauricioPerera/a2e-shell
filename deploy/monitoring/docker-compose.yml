# a2e-shell — observability side-stack (Prometheus + Grafana).
#
# Runs independently of the main a2e-shell container. Prometheus scrapes
# a2e-shell's /metrics over the docker0 gateway (172.17.0.1:8090), so
# neither container needs to share a network with a2e-shell.
#
# Usage:
#   cd deploy/monitoring
#   docker compose up -d
#
# Exposed locally:
#   - Prometheus UI:  http://127.0.0.1:9090  (debug/queries, no auth)
#   - Grafana UI:     http://127.0.0.1:3000  (default login admin/admin)
#
# Reverse-proxy: nginx on the host terminates TLS for a2e.ardf.dev already;
# to expose Grafana externally, add a matching vhost that proxies to
# 127.0.0.1:3000. Until then, port-forward via ssh:
#   ssh -L 3000:127.0.0.1:3000 root@<vps>

services:
  prometheus:
    image: prom/prometheus:v3.1.0
    container_name: a2e-prometheus
    restart: unless-stopped
    # Host networking: lets prometheus reach a2e-shell bound to 127.0.0.1:8090
    # without forcing a2e-shell to expose itself on a non-loopback interface.
    # Container's :9090 is available directly on the host at 127.0.0.1:9090
    # (no `-p` flag needed with host mode).
    network_mode: host
    volumes:
      - ./prometheus.yml:/etc/prometheus/prometheus.yml:ro
      - ./alert.rules.yml:/etc/prometheus/alert.rules.yml:ro
      - prometheus-data:/prometheus
    command:
      - --config.file=/etc/prometheus/prometheus.yml
      - --storage.tsdb.path=/prometheus
      - --storage.tsdb.retention.time=30d
      - --web.console.libraries=/usr/share/prometheus/console_libraries
      - --web.console.templates=/usr/share/prometheus/consoles
      - --web.listen-address=127.0.0.1:9090
    healthcheck:
      test: ["CMD", "wget", "-qO-", "http://127.0.0.1:9090/-/ready"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 10s

  alertmanager:
    image: prom/alertmanager:v0.28.0
    container_name: a2e-alertmanager
    restart: unless-stopped
    # Host networking lets prometheus (also host-net) reach us at 127.0.0.1:9093
    # without naming issues, and keeps the webhook receiver's loopback URL
    # callable from anywhere on the host.
    network_mode: host
    volumes:
      - ./alertmanager.yml:/etc/alertmanager/alertmanager.yml:ro
      - alertmanager-data:/alertmanager
    command:
      - --config.file=/etc/alertmanager/alertmanager.yml
      - --storage.path=/alertmanager
      - --web.listen-address=127.0.0.1:9093
    healthcheck:
      test: ["CMD", "wget", "-qO-", "http://127.0.0.1:9093/-/ready"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 10s

  grafana:
    image: grafana/grafana:11.4.0
    container_name: a2e-grafana
    restart: unless-stopped
    depends_on:
      prometheus:
        condition: service_healthy
    # Host networking for Grafana too — lets it reach prometheus on
    # 127.0.0.1:9090 and stays symmetrical with the prometheus config.
    network_mode: host
    volumes:
      - ./grafana/provisioning:/etc/grafana/provisioning:ro
      - grafana-data:/var/lib/grafana
    environment:
      GF_SECURITY_ADMIN_USER: "${GRAFANA_USER:-admin}"
      GF_SECURITY_ADMIN_PASSWORD: "${GRAFANA_PASSWORD:-admin}"
      GF_USERS_ALLOW_SIGN_UP: "false"
      GF_AUTH_ANONYMOUS_ENABLED: "false"
      GF_ANALYTICS_REPORTING_ENABLED: "false"
      GF_ANALYTICS_CHECK_FOR_UPDATES: "false"
      GF_DASHBOARDS_DEFAULT_HOME_DASHBOARD_PATH: "/etc/grafana/provisioning/dashboards/a2e-shell-overview.json"
      GF_SERVER_HTTP_ADDR: "127.0.0.1"
      GF_SERVER_HTTP_PORT: "3000"
      # Proxied behind nginx (grafana.ardf.dev → 127.0.0.1:3000). Grafana needs
      # to know its external URL so absolute links, OAuth callbacks, and the
      # "share" feature generate the right URLs. Override via env when deploying
      # to a different hostname.
      GF_SERVER_DOMAIN: "${GRAFANA_DOMAIN:-grafana.ardf.dev}"
      GF_SERVER_ROOT_URL: "${GRAFANA_ROOT_URL:-https://grafana.ardf.dev}"
      # Trust X-Forwarded-Proto from the upstream so Grafana generates
      # `https://` URLs even though the connection from nginx → grafana is plain HTTP.
      GF_SERVER_ENFORCE_DOMAIN: "false"
    healthcheck:
      test: ["CMD-SHELL", "wget -qO- http://localhost:3000/api/health | grep -q '\"database\":\"ok\"'"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 20s

volumes:
  prometheus-data:
  grafana-data:
  alertmanager-data:
