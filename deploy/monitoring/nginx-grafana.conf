# nginx vhost for grafana.ardf.dev.
# Deploy to /etc/nginx/sites-enabled/grafana on the VPS.
#
# Traffic path:
#   Browser → Cloudflare (wildcard TLS *.ardf.dev) → VPS:443 (this vhost) → 127.0.0.1:3000 (grafana host-net container)
#
# TLS cert: /etc/letsencrypt/live/ardf.dev/ (same cert the existing a2e.ardf.dev
# vhost uses). Cloudflare does not verify origin cert's name against the
# hostname unless "Full (Strict)" mode is enabled AND the cert's SAN includes
# the hostname. For "Full" mode (current config for a2e.ardf.dev), any cert
# Cloudflare can chain-verify is accepted.
#
# Prereq: Cloudflare DNS record `grafana` (CNAME → ardf.dev, or A → VPS IP)
# with the orange cloud enabled. Cloudflare auto-issues / renews the public
# wildcard cert.

server {
    listen 80;
    listen [::]:80;
    server_name grafana.ardf.dev;

    # Grafana's own session cookie + CSRF handling is enough; no redirect to HTTPS
    # because Cloudflare already terminates TLS and forwards HTTP to origin in
    # "Flexible" mode (not current) or HTTPS in "Full"/"Full Strict" (current).
    # Keep the :80 block present so Cloudflare's HTTP health probes don't 502.

    location / {
        proxy_pass http://127.0.0.1:3000;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        # Grafana uses WebSocket for live panels + alerting UI — upgrade-hop is
        # mandatory here, or live queries break silently.
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";
        proxy_buffering off;
        proxy_cache off;
        proxy_read_timeout 300s;
        proxy_send_timeout 300s;
        client_max_body_size 10M;
    }
}

server {
    listen 443 ssl;
    listen [::]:443 ssl;
    server_name grafana.ardf.dev;

    # Same cert infrastructure as the a2e vhost. Cert actually covers only
    # `ardf.dev` in its SAN, but Cloudflare in "Full" mode does not validate
    # the SAN against the hostname — it only requires a valid chain. If the
    # mode ever flips to "Full (Strict)", this vhost needs a cert with
    # `grafana.ardf.dev` in its SAN (rotate the letsencrypt config to include
    # it as an additional domain).
    ssl_certificate /etc/letsencrypt/live/ardf.dev/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/ardf.dev/privkey.pem;
    include /etc/letsencrypt/options-ssl-nginx.conf;
    ssl_dhparam /etc/letsencrypt/ssl-dhparams.pem;

    # Don't trust client-provided X-Forwarded-* headers — only accept them from
    # Cloudflare IPs. (Optional hardening; skipping here to match the pattern
    # the existing a2e vhost uses.)

    location / {
        proxy_pass http://127.0.0.1:3000;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";
        proxy_buffering off;
        proxy_cache off;
        proxy_read_timeout 300s;
        proxy_send_timeout 300s;
        client_max_body_size 10M;
    }
}
