# Prometheus scrape config for the a2e-shell observability stack.
#
# Targets scraped:
#   - a2e-shell: /metrics exposed on port 8090 of the host (host.docker.internal)
#   - prometheus itself (self-metrics)
#
# If more services are added later (mcp-serve-catalog, reverse-proxy with
# /stub_status, etc.) they go as additional `- job_name` entries below.

global:
  scrape_interval: 15s
  scrape_timeout: 10s
  evaluation_interval: 15s
  external_labels:
    host: "a2e.ardf.dev"

rule_files:
  - /etc/prometheus/alert.rules.yml

alerting:
  alertmanagers:
    - static_configs:
        - targets: ["127.0.0.1:9093"]

scrape_configs:
  - job_name: "a2e-shell"
    # a2e-shell exposes Prometheus format at /metrics without auth.
    # Prometheus runs in host network mode (see docker-compose.yml) so it
    # can reach a2e-shell's loopback-only binding at 127.0.0.1:8090 directly.
    metrics_path: /metrics
    static_configs:
      - targets: ["127.0.0.1:8090"]
        labels:
          service: "a2e-shell"
          environment: "prod"

  - job_name: "prometheus"
    static_configs:
      - targets: ["127.0.0.1:9090"]
        labels:
          service: "prometheus"
