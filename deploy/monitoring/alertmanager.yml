# Alertmanager config for the a2e-shell observability stack.
#
# Default wiring: a catch-all webhook receiver that posts to a local URL
# the operator fills in post-deploy. The alert still shows up in the
# Alertmanager UI (http://127.0.0.1:9093) and in the dashboard; the
# webhook is only needed to push notifications elsewhere (Discord,
# Slack, Telegram, email relay, PagerDuty).
#
# To plug in a real receiver:
#   - Discord: `webhook_url` → https://discord.com/api/webhooks/...
#   - Slack: `webhook_url` → https://hooks.slack.com/services/...
#   - Generic: any endpoint that accepts POST with Alertmanager's JSON payload
#   Document: https://prometheus.io/docs/alerting/latest/notification_examples/

global:
  # How long after a rule stops firing before we declare it resolved.
  resolve_timeout: 5m

# Routing: the top-level route is a catch-all.
# Inheritance means child routes override only the fields they declare.
# group_wait / group_interval / repeat_interval live on the route, not on
# `global` — Alertmanager config rejects them at the top level.
route:
  receiver: default-webhook
  group_by: ["alertname", "service", "severity"]
  # Aggregate alerts firing near-simultaneously before first notification.
  group_wait: 30s
  # Wait this long before a follow-up notification for new alerts added to
  # an already-firing group.
  group_interval: 5m
  # Re-send an active (unresolved) alert every 4 hours.
  repeat_interval: 4h
  # Critical alerts get their own route with shorter waits so they don't sit
  # in the aggregation window behind noisier warnings.
  routes:
    - match:
        severity: critical
      receiver: default-webhook
      group_wait: 10s
      group_interval: 1m
      repeat_interval: 30m
      continue: false

# Receivers.
# `default-webhook` posts JSON to a local placeholder that rejects with 503.
# Alertmanager's retry loop will keep the alert "active" and visible in the
# UI until the operator wires a real URL. Alerts are still queryable via the
# Alertmanager API (http://127.0.0.1:9093/api/v2/alerts) regardless.
receivers:
  - name: default-webhook
    webhook_configs:
      - url: "http://127.0.0.1:5001/a2e-alerts"
        # send_resolved: true so downstream sees both firing and resolved events.
        send_resolved: true
        max_alerts: 0

# Inhibit: suppress noisy alerts when a bigger alert is already firing.
# If the service is down (A2eShellDown critical), don't also wake someone
# for latency/error-rate warnings — they're downstream of the downness.
inhibit_rules:
  - source_matchers:
      - alertname="A2eShellDown"
      - severity="critical"
    target_matchers:
      - service="a2e-shell"
    # Inhibit EVERY a2e-shell alert when the service is down.
    equal: ["service"]
