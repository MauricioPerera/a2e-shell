# Loads every *.json under /etc/grafana/provisioning/dashboards/ as a
# Grafana dashboard. Edits made through the UI are persisted in the
# named volume; the JSON file is the declarative source of truth and
# gets re-applied on every container restart.

apiVersion: 1

providers:
  - name: "a2e-shell"
    orgId: 1
    folder: ""
    type: file
    disableDeletion: false
    allowUiUpdates: true
    updateIntervalSeconds: 60
    options:
      path: /etc/grafana/provisioning/dashboards
      foldersFromFilesStructure: false
