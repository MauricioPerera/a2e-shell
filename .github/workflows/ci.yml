name: CI

on:
  push:
    branches: [main]
    tags: ["v*"]
  pull_request:

permissions:
  contents: read

jobs:
  verify:
    name: verify (typecheck + tests)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: "npm"
      - run: npm ci --no-audit --no-fund
      - run: npm run typecheck
      - run: npm test

  bench:
    name: bench (perf SLO gate)
    runs-on: ubuntu-latest
    # Ubuntu runner has bash at /bin/bash natively and no concurrent workload,
    # so p95 budgets in tests/benchmarks/http.bench.ts should hold comfortably.
    # Keep samples high enough that random GC pauses don't push p95 over.
    env:
      A2E_BENCH_SAMPLES: "1000"
      A2E_BENCH_WARMUP: "100"
      A2E_LOG_LEVEL: "warn"
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: "npm"
      - run: npm ci --no-audit --no-fund
      - run: npm run bench:http
        env:
          A2E_BENCH_JSON_OUT: bench-results.json
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: bench-results
          path: bench-results.json
          retention-days: 30

  # Production Docker image smoke — gates the compiled + pruned layout that
  # vitest can't exercise. Closes the v1.3.0 postmortem followup: two
  # packaging bugs shipped in rc (peggy as devDep, grammar.pegjs not in dist)
  # that only surfaced in prod because the test suite runs from src/.
  #
  # Runs on every push to main and on any tag, so a bad build never
  # survives into a release without tripping this gate first.
  docker-smoke:
    name: docker smoke (prod image)
    runs-on: ubuntu-latest
    if: github.event_name == 'push' || github.event_name == 'pull_request'
    steps:
      - uses: actions/checkout@v4
      - name: Build + run + smoke (bounded + stdio MCP)
        run: |
          chmod +x scripts/smoke-prod-image.sh
          bash scripts/smoke-prod-image.sh
